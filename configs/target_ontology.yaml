      de: ["vorderes kreuzbandruptur", "vkb ruptur", "vkb-ruptur", "vkb-läsion", "läsion des vorderen kreuzbandes", "vkb teilläsion"]
    negative_terms:
      en: ["acl is intact", "intact acl", "normal acl", "unremarkable acl", "no acl tear", "without acl disruption", "anterior cruciate ligament is intact", "no evidence of acl tear"]
