[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection Solution"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy<2.0.0",
    "pandas",
    "pydicom",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
    "timm",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
